apiVersion: v1
kind: Pod
metadata:
  name: multiple-containers
spec:
  volumes:
    - name: html
      emptyDir: {}
  containers:
    - name: web
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
    - name: sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args: ["while true; do echo hello $(date) > /html/index.html; sleep 5; done"]
      volumeMounts:
        - name: html
          mountPath: /html