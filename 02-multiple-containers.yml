apiVersion: v1
kind: Pod
metadata:
  name: multiple-containers
spec:
  containers:
    - name: web
      image: nginx:alpine
      ports:
        - containerPort: 80
    - name: sidecar
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - while true; do echo "$(date): sidecar running"; sleep 5; done
