apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  username: "REPLACE_WITH_USERNAME"
  password: "REPLACE_WITH_PASSWORD"
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Secret values are available to the container'; sleep 3600"]
      env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: password
      volumeMounts:
        - name: secret-files
          mountPath: /etc/app-secrets
          readOnly: true
  volumes:
    - name: secret-files
      secret:
        secretName: app-secret