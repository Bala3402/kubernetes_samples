apiVersion: v1
kind: Pod
metadata:
  name: init-container-demo
  labels:
    app: demo
spec:
  # Shared volume for passing files from init container to main container
  volumes:
    - name: workdir
      emptyDir: {}

  # Init containers run sequentially before app containers
  initContainers:
    # Init Container 1: Setup data in shared storage
    - name: install-assets
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "<h1>Generated by Init Container</h1>" > /work-dir/index.html
          echo "Init step 1 complete."
      volumeMounts:
        - name: workdir
          mountPath: /work-dir

    # Init Container 2: Wait for an external dependency (service/DNS check)
    - name: wait-for-service
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Checking network connectivity..."
          # Example: sleep to simulate checking a dependency
          sleep 5
          echo "Dependency ready!"

  # Main app containers only start after ALL init containers succeed
  containers:
    - name: web-server
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: workdir
          mountPath: /usr/share/nginx/html  # Reads the file created by install-assets