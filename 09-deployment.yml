apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: web
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80



            #Avliable replicas local system is 101 
            #
# Action	                           Command
# Apply /  Create	                  kubectl apply -f deployment.yaml
# Check Status	                    kubectl get deployments
# View Rollout Progress	            kubectl rollout status deployment/web-app-deployment
# Check Rollout History	            kubectl rollout history deployment/web-app-deployment
# Rollback to Previous Version	    kubectl rollout undo deployment/web-app-deployment
# Scale Dynamically           	    kubectl scale deployment/web-app-deployment --replicas=5


