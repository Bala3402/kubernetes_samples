apiVersion: v1
kind: Pod
metadata:
  name: native-sidecar-demo
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}

  initContainers:
    # Native sidecar: runs in initContainers with restartPolicy: Always
    - name: log-shipper-sidecar
      image: busybox:1.36
      restartPolicy: Always   # <-- Makes this a native sidecar
      command: ["/bin/sh", "-c"]
      args:
        - |
          # Simulates shipping logs produced by the app container
          touch /var/log/app.log
          tail -n+1 -F /var/log/app.log
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log

  containers:
    # Main application container
    - name: app-container
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date) - [INFO] Application transaction processed" >> /var/log/app.log
            sleep 3
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log